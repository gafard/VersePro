name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    # VersePro est distribué sous macOS et Windows, et ne tournait en
    # intégration que sous Linux. Un défaut propre à Windows ne pouvait donc
    # être découvert qu'en production — c'est exactement ce qui est arrivé.
    # La matrice ferme cet angle mort ; Linux reste dans la liste parce qu'il
    # est le plus rapide et attrape l'essentiel en premier.
    name: Tests backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    defaults:
      run:
        shell: bash
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt

      - name: Dépendances système (PyAudio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Tests
        env:
          # ONNX/Silero se fige sur le runner Ubuntu. Sur les plateformes
          # réellement livrées, le test DOIT tourner : c'est là qu'une barrière
          # vocale sourde se voit — elle a bloqué 100 % d'une prédication sans
          # que rien ne le signale.
          VERSEPRO_SKIP_NATIVE_VAD_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
        # Les tests réseau/API passent d'abord dans un interpréteur propre. Les
        # runtimes ONNX/ASR chargés par les autres tests peuvent conserver de
        # nombreux threads natifs sur les petits runners Linux et affamer la
        # boucle asyncio du faux serveur TCP ProPresenter.
        #
        # Le timeout évite qu'une bibliothèque native bloque un runner pendant
        # six heures et donne le nom précis du test fautif dans les logs.
        run: |
          python -m pytest \
            tests/test_projection_version.py \
            tests/test_propresenter_protocol.py \
            -vv --timeout=15
          python -m pytest tests/ test_parser.py \
            --ignore=tests/test_projection_version.py \
            --ignore=tests/test_propresenter_protocol.py \
            -vv --timeout=30

      - name: Audit des dépendances Python
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    name: Build frontend (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Vérifier le lanceur Tauri
        working-directory: v2/frontend/src-tauri
        # Le vrai backend PyInstaller n'est copié qu'au workflow de release.
        # Le build-script Tauri exige néanmoins que la ressource déclarée
        # existe déjà, même pour un simple `cargo check`.
        run: mkdir -p backend && cargo check --locked
