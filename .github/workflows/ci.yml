name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt

      - name: Dépendances système (PyAudio)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Tests
        env:
          # ONNX/Silero se fige sur le runner Ubuntu alors que VersePro n'est
          # pas distribué sous Linux. Le workflow Release exécute ce test sur
          # les deux plateformes réellement livrées : macOS et Windows.
          VERSEPRO_SKIP_NATIVE_VAD_TEST: "1"
        # Le timeout évite qu'une bibliothèque native bloque un runner pendant
        # six heures et donne le nom précis du test fautif dans les logs.
        run: python -m pytest tests/ test_parser.py -vv --timeout=30

      - name: Audit des dépendances Python
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    name: Build frontend (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Vérifier le lanceur Tauri
        working-directory: v2/frontend/src-tauri
        # Le vrai backend PyInstaller n'est copié qu'au workflow de release.
        # Le build-script Tauri exige néanmoins que la ressource déclarée
        # existe déjà, même pour un simple `cargo check`.
        run: mkdir -p backend && cargo check --locked
