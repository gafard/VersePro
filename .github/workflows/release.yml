name: Release (installeurs macOS + Windows)

# Tauri et PyInstaller ne cross-compilent pas : chaque installeur est construit
# sur son OS natif. Déclenchement : tag `v*` ou lancement manuel (onglet Actions).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: "Autoriser des installateurs de test non signés si les certificats sont absents"
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            bundles: |
              v2/frontend/src-tauri/target/release/bundle/dmg/*.dmg
              v2/frontend/src-tauri/target/release/bundle/macos/*.app
          - os: windows-latest
            label: Windows (x64)
            bundles: |
              v2/frontend/src-tauri/target/release/bundle/msi/*.msi
              v2/frontend/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # Un lancement manuel sert aussi à fabriquer des builds de validation.
      # Les publications par tag restent, elles, obligatoirement signées.
      ALLOW_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier la politique de signature
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$HAS_APPLE_CERT" != "true" ]; then
            if [ "$ALLOW_UNSIGNED" = "true" ]; then
              echo "::warning::Certificat Apple Developer ID absent : le DMG de test sera non signé et non notarialisé."
            else
              echo "::error::Certificat Apple Developer ID absent. Une publication par tag doit être signée."
              exit 1
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ "$HAS_WIN_CERT" != "true" ]; then
            if [ "$ALLOW_UNSIGNED" = "true" ]; then
              echo "::warning::Certificat Windows absent : les installateurs de test seront non signés."
            else
              echo "::error::Certificat Windows absent. Une publication par tag doit être signée."
              exit 1
            fi
          fi

      # ── 1. Geler le backend Python (PyInstaller onedir) ──
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt

      - name: Dépendances backend (sans ndi-python ni pyaudio)
        working-directory: v2/backend
        # ndi-python : exclu du gel de toute façon (spec excludes NDIlib) et sans
        # roue fiable en 3.12 ; pyaudio : jamais importé (l'audio arrive par
        # WebSocket). Les retirer rend l'installation CI déterministe.
        run: |
          python -c "
          lines = [l for l in open('requirements.txt')
                   if not l.strip().startswith(('ndi-python', 'pyaudio'))]
          open('requirements-ci.txt', 'w').writelines(lines)
          "
          pip install -r requirements-ci.txt pyinstaller

      - name: Geler le backend
        working-directory: v2/backend
        run: pyinstaller --clean --noconfirm versepro-backend.spec

      - name: Vérifier le gel (index pré-calculé + Bible embarqués)
        working-directory: v2/backend
        run: |
          ls dist/versepro-backend/_internal/data/bible.json
          ls dist/versepro-backend/_internal/data/semantic/index-*.npz
          echo "gel OK : ressources présentes"

      # Le moteur ASR local est du ctypes pur : la bibliothèque native arrive
      # par la roue transcribe-cpp-native. Si PyInstaller ne l'embarque pas, le
      # gel se construit quand même et le backend démarre — Nemotron se
      # contente d'échouer au premier clic sur le micro, en production. Une
      # vérification de présence coûte une seconde et évite ça.
      - name: Vérifier la bibliothèque ASR native embarquée
        working-directory: v2/backend
        run: |
          set -u
          TROUVE=$(find dist/versepro-backend -iname "libtranscribe*" -o -iname "transcribe*.dll" | head -5)
          if [ -z "$TROUVE" ]; then
            echo "::error::bibliothèque native transcribe.cpp absente du gel — Nemotron serait indisponible"
            find dist/versepro-backend -iname "*transcribe*" | head -20
            exit 1
          fi
          echo "$TROUVE"

      # Test de démarrage RÉEL du backend figé. Vérifier la présence des
      # fichiers ne prouve rien : un exécutable peut se construire puis mourir à
      # l'exécution (DLL manquante, import cassé). Sans ce test, un backend mort
      # part en production et l'utilisateur ne voit qu'un « Hors ligne ».
      - name: Le backend figé démarre et répond
        working-directory: v2/backend
        run: |
          set -u
          EXE="dist/versepro-backend/versepro-backend"
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          DATA="$(mktemp -d 2>/dev/null || echo "${TMP:-/tmp}/vp-smoke-$$")"
          mkdir -p "$DATA"
          VERSEPRO_HOST=127.0.0.1 VERSEPRO_PORT=17999 VERSEPRO_DATA_DIR="$DATA" \
            "$EXE" > smoke.log 2>&1 &
          PID=$!
          # Le chargement (Bible, index flou, sémantique) prend ~16 s sur un PC
          # modeste ; les runners partagés sont plus lents encore.
          for i in $(seq 1 120); do
            if curl -fsS -m 2 http://127.0.0.1:17999/api/v1/health > health.json 2>/dev/null; then
              echo "✅ backend prêt après ${i}s :"; cat health.json; echo
              kill $PID 2>/dev/null || true
              exit 0
            fi
            kill -0 $PID 2>/dev/null || { echo "❌ le backend figé s'est arrêté seul"; cat smoke.log; exit 1; }
            sleep 1
          done
          echo "❌ le backend figé n'a jamais répondu en 120 s"
          cat smoke.log
          kill $PID 2>/dev/null || true
          exit 1

      # ── 2. Embarquer le backend dans les ressources Tauri ──
      - name: Copier le backend dans src-tauri/backend
        run: |
          rm -rf v2/frontend/src-tauri/backend
          cp -R v2/backend/dist/versepro-backend v2/frontend/src-tauri/backend

      # ── 3. Construire l'application Tauri ──
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: v2/frontend/src-tauri

      - name: Importer le certificat Windows
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("selah.pfx", $bytes)
          $pwd = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath selah.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item selah.pfx
          $conf = Get-Content v2/frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows.certificateThumbprint = $cert.Thumbprint
          $conf.bundle.windows.timestampUrl = "http://timestamp.digicert.com"
          $conf | ConvertTo-Json -Depth 32 | Set-Content v2/frontend/src-tauri/tauri.conf.json

      - name: Build Tauri
        working-directory: v2/frontend
        # macOS : le bundler Tauri signe et notarise NATIVEMENT dès que ces
        # variables existent (secrets du dépôt).
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run tauri build -- --bundles app
          else
            npm run tauri build
          fi

      # Le bundler DMG de Tauri met en scène la fenêtre via AppleScript et le
      # Finder — il a déjà échoué sur cette application. Aucun habillage DMG
      # n'est configuré ici, donc hdiutil produit l'équivalent sans dépendre
      # d'une session graphique. Le .app seul ne suffit pas : upload-artifact
      # le re-zippe et perd le bit exécutable du binaire.
      - name: Assembler le DMG (hdiutil)
        if: runner.os == 'macOS'
        working-directory: v2/frontend/src-tauri/target/release/bundle
        run: |
          version=$(python3 -c "import json;print(json.load(open('$GITHUB_WORKSPACE/v2/frontend/src-tauri/tauri.conf.json'))['version'])")
          mkdir -p dmg staging
          cp -R macos/VersePro.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "VersePro" -srcfolder staging -ov \
                         -format UDZO "dmg/VersePro_${version}_aarch64.dmg"
          rm -rf staging
          ls -lh dmg/

      # ── 4. Publier les installeurs ──
      - uses: actions/upload-artifact@v7
        with:
          name: versepro-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ matrix.bundles }}
