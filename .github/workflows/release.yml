name: Release (installeurs macOS + Windows)

# Tauri et PyInstaller ne cross-compilent pas : chaque installeur est construit
# sur son OS natif. Déclenchement : tag `v*` ou lancement manuel (onglet Actions).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: "Autoriser des installateurs de test non signés si les certificats sont absents"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

# ACTIONS TIERCES ÉPINGLÉES SUR UN COMMIT, PAS SUR UN TAG.
#
# Un tag se déplace. `@v2` désigne aujourd'hui un commit, demain un autre, et
# celui qui contrôle le dépôt de l'action décide lequel. Or ce workflow confie
# à ces actions un environnement qui contient TAURI_SIGNING_PRIVATE_KEY,
# APPLE_CERTIFICATE et WINDOWS_CERTIFICATE : la clé qui signe les mises à jour
# automatiques installées dans les églises, sans qu'un clic soit demandé.
#
# Le SHA est immuable. Pour mettre à jour une action, on résout le nouveau
# commit du tag et on le remplace ici, volontairement.

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            bundles: |
              v2/frontend/src-tauri/target/release/bundle/dmg/*.dmg
              v2/frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz
              v2/frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            label: Windows (x64)
            bundles: |
              v2/frontend/src-tauri/target/release/bundle/msi/*.msi
              v2/frontend/src-tauri/target/release/bundle/msi/*.msi.sig
              v2/frontend/src-tauri/target/release/bundle/nsis/*.exe
              v2/frontend/src-tauri/target/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.os }}
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      # Un lancement manuel sert aussi à fabriquer des builds de validation.
      # La signature Updater reste obligatoire pour une publication par tag ;
      # les certificats OS, eux, améliorent la réputation Gatekeeper/SmartScreen
      # mais leur absence ne doit plus empêcher de livrer une version récente.
      ALLOW_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier la version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('v2/frontend/src-tauri/tauri.conf.json'))['version'])")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version v${VERSION} de tauri.conf.json"
            exit 1
          fi

      - name: Vérifier la politique de signature
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$HAS_APPLE_CERT" != "true" ]; then
            echo "::warning::Certificat Apple Developer ID absent : le DMG sera non signé et non notarialisé."
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ "$HAS_WIN_CERT" != "true" ]; then
            echo "::warning::Certificat Windows absent : les installateurs déclencheront probablement SmartScreen."
          fi
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            if [ "$ALLOW_UNSIGNED" = "true" ]; then
              echo "::warning::Clé Updater absente : ce build de test ne produira pas d'artefact de mise à jour."
            else
              echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY absent. Une release auto-installable doit être signée."
              exit 1
            fi
          fi

      # ── 1. Geler le backend Python (PyInstaller onedir) ──
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt

      - name: Dépendances backend (sans pyaudio)
        working-directory: v2/backend
        # pyaudio : jamais importé (l'audio arrive par WebSocket) et sans roue
        # officielle sous Windows. Le retirer rend l'installation déterministe.
        #
        # ndi-python N'EST PLUS RETIRÉ. Il l'était au motif que le spec excluait
        # NDIlib et qu'aucune roue 3.12 n'existait : les deux sont faux
        # aujourd'hui. Le spec ne l'exclut plus, et PyPI publie des roues de
        # cp310 à cp314 pour macOS arm64, Windows x64 et Linux.
        #
        # Conséquence de ce retrait : l'application livrée n'avait AUCUN module
        # NDIlib, donc NDI_AVAILABLE valait False pour toujours, et l'écran
        # Paramètres réclamait l'installation du « Runtime NDI ». Ce runtime ne
        # pouvait rien y faire — il ne fournit pas le binding Python — d'où un
        # message qui revenait indéfiniment après chaque installation.
        run: |
          python -c "
          lines = [l for l in open('requirements.txt')
                   if not l.strip().startswith('pyaudio')]
          open('requirements-ci.txt', 'w').writelines(lines)
          "
          pip install -r requirements-ci.txt pyinstaller
          python -c "import transcribe_cpp; assert transcribe_cpp.backends(); print('transcribe.cpp natif OK:', transcribe_cpp.library_path())"
          python -c "import NDIlib; print('binding NDI OK')"

      - name: Vérifier le VAD natif sur la plateforme distribuée
        working-directory: v2/backend
        run: |
          python - <<'PY'
          import numpy as np
          from app.services.vad_service import VoiceGate, vad_available

          assert vad_available(), "modèle silero_vad.onnx absent"
          gate = VoiceGate(sample_rate=16000)
          silence = np.zeros(4096, dtype=np.int16).tobytes()
          assert gate.accept(silence) is False
          assert gate.stats()["chunks_blocked"] == 1

          # ET QU'ELLE S'OUVRE. Refuser le silence ne prouve rien : une porte
          # morte le fait aussi. Nourri d'une fenêtre incomplète, Silero
          # répondait presque zéro à TOUT et bloquait 100 % d'une prédication
          # réelle — cette vérification passait quand même.
          bruit = (np.random.randn(4096) * 0.2 * 32767).astype(np.int16).tobytes()
          gate2 = VoiceGate(sample_rate=16000)
          assert gate2.accept(bruit) is True, "la barrière vocale ne s'ouvre sur rien"
          print("VAD Silero natif OK (bloque le silence, s'ouvre sur du signal)")
          PY

      - name: Geler le backend
        working-directory: v2/backend
        run: pyinstaller --clean --noconfirm versepro-backend.spec

      - name: Vérifier le gel (index pré-calculé + Bible embarqués)
        working-directory: v2/backend
        run: |
          ls dist/versepro-backend/_internal/data/bible.json
          ls dist/versepro-backend/_internal/data/semantic/index-*.npz
          echo "gel OK : ressources présentes"

      # Le moteur ASR local est du ctypes pur : la bibliothèque native arrive
      # par la roue transcribe-cpp-native. Si PyInstaller ne l'embarque pas, le
      # gel se construit quand même et le backend démarre — Nemotron se
      # contente d'échouer au premier clic sur le micro, en production. Une
      # vérification de présence coûte une seconde et évite ça.
      - name: Vérifier la bibliothèque ASR native embarquée
        working-directory: v2/backend
        run: |
          set -u
          TROUVE=$(find dist/versepro-backend -iname "libtranscribe*" -o -iname "transcribe*.dll" | head -5)
          if [ -z "$TROUVE" ]; then
            echo "::error::bibliothèque native transcribe.cpp absente du gel — Nemotron serait indisponible"
            find dist/versepro-backend -iname "*transcribe*" | head -20
            exit 1
          fi
          echo "$TROUVE"

      # Même raisonnement que pour transcribe.cpp : la sortie NDI échouait en
      # production, jamais à la construction. Le binding ET le runtime NDI
      # voyagent dans la même roue — si la bibliothèque de 30 Mo n'est pas dans
      # le gel, l'église verra « NDI non détecté » quoi qu'elle installe.
      - name: Vérifier la bibliothèque NDI embarquée
        working-directory: v2/backend
        run: |
          set -u
          TROUVE=$(find dist/versepro-backend \( -iname "libndi*" -o -iname "Processing.NDI.Lib*" \) | head -5)
          if [ -z "$TROUVE" ]; then
            echo "::error::runtime NDI absent du gel — la sortie NDI serait indisponible"
            find dist/versepro-backend -iname "*ndi*" | head -20
            exit 1
          fi
          echo "$TROUVE"

      # Test de démarrage RÉEL du backend figé. Vérifier la présence des
      # fichiers ne prouve rien : un exécutable peut se construire puis mourir à
      # l'exécution (DLL manquante, import cassé). Sans ce test, un backend mort
      # part en production et l'utilisateur ne voit qu'un « Hors ligne ».
      - name: Le backend figé démarre et répond
        working-directory: v2/backend
        run: |
          set -u
          EXE="dist/versepro-backend/versepro-backend"
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          DATA="$(mktemp -d 2>/dev/null || echo "${TMP:-/tmp}/vp-smoke-$$")"
          mkdir -p "$DATA"
          VERSEPRO_HOST=127.0.0.1 VERSEPRO_PORT=17999 VERSEPRO_DATA_DIR="$DATA" \
            VERSEPRO_SESSION_TOKEN="release-smoke-token" \
            "$EXE" > smoke.log 2>&1 &
          PID=$!
          # Le chargement (Bible, index flou, sémantique) prend ~16 s sur un PC
          # modeste ; les runners partagés sont plus lents encore.
          for i in $(seq 1 120); do
            if curl -fsS -m 2 -H "Authorization: Bearer release-smoke-token" \
              http://127.0.0.1:17999/api/v1/health > health.json 2>/dev/null; then
              echo "✅ backend prêt après ${i}s :"; cat health.json; echo
              python - <<'PY'
          import asyncio
          import json
          import websockets

          async def smoke_audio_websocket():
              async with websockets.connect(
                  "ws://127.0.0.1:17999/ws/audio?engine=auto",
                  subprotocols=["versepro", "versepro.auth.release-smoke-token"],
              ) as websocket:
                  assert websocket.subprotocol == "versepro", websocket.subprotocol
                  message = json.loads(await asyncio.wait_for(websocket.recv(), timeout=5))
                  assert message["type"] == "ai_status", message

          asyncio.run(smoke_audio_websocket())
          print("OK canal audio WebSocket authentifie")
          PY
              kill $PID 2>/dev/null || true
              exit 0
            fi
            kill -0 $PID 2>/dev/null || { echo "❌ le backend figé s'est arrêté seul"; cat smoke.log; exit 1; }
            sleep 1
          done
          echo "❌ le backend figé n'a jamais répondu en 120 s"
          cat smoke.log
          kill $PID 2>/dev/null || true
          exit 1

      # ── 2. Embarquer le backend dans les ressources Tauri ──
      - name: Copier le backend dans src-tauri/backend
        run: |
          rm -rf v2/frontend/src-tauri/backend
          cp -R v2/backend/dist/versepro-backend v2/frontend/src-tauri/backend

      # ── 3. Construire l'application Tauri ──
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: v2/frontend/src-tauri

      # PUBLIER CE QUI A ÉTÉ TESTÉ, ET RIEN D'AUTRE.
      #
      # La CI vérifie le lanceur avec `cargo check --locked` ; ce workflow, lui,
      # construisait sans. Quand le verrou et Cargo.toml divergeaient, la CI
      # échouait et la release passait quand même — en régénérant le verrou en
      # silence. C'est arrivé : le bump vers 2.1.5 a laissé Cargo.lock à 2.1.4,
      # la CI est restée rouge à chaque poussée, et la version est partie dans
      # les églises sans qu'aucune intégration ne soit verte.
      #
      # Vérifier ici plutôt qu'ajouter `--locked` au build : même garantie —
      # si la résolution ne bouge pas, la construction n'y touchera pas — sans
      # modifier une commande de construction que la CI ne rejoue jamais.
      - name: Le verrou Cargo correspond au manifeste
        working-directory: v2/frontend/src-tauri
        run: |
          mkdir -p backend
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::error::Cargo.lock ne correspond pas à Cargo.toml. Lancez \`cargo check\` dans v2/frontend/src-tauri et commitez Cargo.lock avant de taguer."
            exit 1
          fi
          echo "verrou cohérent"

      - name: Importer le certificat Windows
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("selah.pfx", $bytes)
          $pwd = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath selah.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item selah.pfx
          $conf = Get-Content v2/frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows.certificateThumbprint = $cert.Thumbprint
          $conf.bundle.windows.timestampUrl = "http://timestamp.digicert.com"
          $conf | ConvertTo-Json -Depth 32 | Set-Content v2/frontend/src-tauri/tauri.conf.json

      - name: Build Tauri
        working-directory: v2/frontend
        # macOS : le bundler Tauri signe et notarise NATIVEMENT dès que ces
        # variables existent (secrets du dépôt).
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          # Les builds manuels de diagnostic restent possibles sans clé.
          # Une release par tag, elle, a déjà été refusée plus haut si la clé
          # cryptographique manque.
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            python3 -c "import json; p='src-tauri/tauri.conf.json'; d=json.load(open(p)); d['bundle']['createUpdaterArtifacts']=False; open(p,'w').write(json.dumps(d))"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Une variable APPLE_CERTIFICATE présente mais vide suffit à faire
            # croire au bundler Tauri qu'il doit importer un certificat. Pour
            # un build manuel non signé, il faut donc retirer complètement ces
            # variables de l'environnement du processus enfant.
            if [ "$HAS_APPLE_CERT" != "true" ]; then
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
              unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            fi
            npm run tauri build -- --bundles app
          else
            npm run tauri build
          fi

      # Le bundler DMG de Tauri met en scène la fenêtre via AppleScript et le
      # Finder — il a déjà échoué sur cette application. Aucun habillage DMG
      # n'est configuré ici, donc hdiutil produit l'équivalent sans dépendre
      # d'une session graphique. Le .app seul ne suffit pas : upload-artifact
      # le re-zippe et perd le bit exécutable du binaire.
      - name: Assembler le DMG (hdiutil)
        if: runner.os == 'macOS'
        working-directory: v2/frontend/src-tauri/target/release/bundle
        run: |
          version=$(python3 -c "import json;print(json.load(open('$GITHUB_WORKSPACE/v2/frontend/src-tauri/tauri.conf.json'))['version'])")
          mkdir -p dmg staging
          cp -R macos/VersePro.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "VersePro" -srcfolder staging -ov \
                         -format UDZO "dmg/VersePro_${version}_aarch64.dmg"
          rm -rf staging
          ls -lh dmg/

      # ── 4. Publier les installeurs ──
      - uses: actions/upload-artifact@v7
        with:
          name: versepro-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ matrix.bundles }}

  publish:
    name: Publier la release et latest.json
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: versepro-*
          path: release-assets
          merge-multiple: true

      - name: Construire le manifeste Updater multi-plateforme
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('release-assets')
          publish = Path('publish')
          publish.mkdir()

          def exactly(pattern):
              matches = sorted(path for path in root.rglob(pattern) if path.is_file())
              if len(matches) != 1:
                  raise SystemExit(f"Attendu exactement un fichier {pattern}, trouvé: {matches}")
              return matches[0]

          mac = exactly('*.app.tar.gz')
          mac_sig = Path(f'{mac}.sig')
          win = exactly('*-setup.exe')
          win_sig = Path(f'{win}.sig')
          for signature in (mac_sig, win_sig):
              if not signature.is_file() or not signature.read_text().strip():
                  raise SystemExit(f'Signature Updater absente ou vide: {signature}')

          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')
          base = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{tag}"

          def url(path):
              return f"{base}/{urllib.parse.quote(path.name)}"

          manifest = {
              'version': version,
              'notes': f'VersePro {version}',
              'pub_date': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': {
                  'darwin-aarch64': {
                      'url': url(mac),
                      'signature': mac_sig.read_text().strip(),
                  },
                  'windows-x86_64': {
                      'url': url(win),
                      'signature': win_sig.read_text().strip(),
                  },
              },
          }
          (publish / 'latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          for pattern in ('*.dmg', '*.app.tar.gz', '*.app.tar.gz.sig', '*.exe', '*.exe.sig', '*.msi', '*.msi.sig'):
              for source in root.rglob(pattern):
                  if source.is_file():
                      shutil.copy2(source, publish / source.name)

          print((publish / 'latest.json').read_text())
          PY

      - name: Publier les installateurs signés
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: publish/*
