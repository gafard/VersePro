[package]
name = "app"
version = "2.1.1"
description = "VersePro — régie de projection biblique en direct"
authors = ["Selah Studios"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
# L'ouverture de liens externes (guides, dons) passe par le plugin shell en v2.
tauri-plugin-shell = "2"
tauri-plugin-updater = "=2.10.1"
rand = "0.8"

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
