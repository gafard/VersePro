<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>VersePro · compagnon</title>
<style>
:root{color-scheme:dark;--paper:#101116;--ink:#f1f1f4;--muted:#b6b7c0;--accent:#ee943f;--line:#353640;--font:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);padding:24px;max-width:960px;margin-inline:auto}header{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}small,label{color:var(--muted)}h1{font-size:clamp(24px,5vw,48px);color:var(--accent)}article p{font-size:clamp(24px,5vw,48px);line-height:1.45}section{margin-top:32px}button,input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--paper);color:var(--ink);max-width:100%}button{cursor:pointer;min-height:48px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4}form,.actions{display:flex;flex-wrap:wrap;gap:12px}input{flex:1;min-width:120px}#message{color:var(--accent)}[hidden]{display:none!important}
</style>
<header><strong>versepro</strong><small id="connection">Connexion…</small></header>
<section><label for="language">Traduction affichée</label> <select id="language"><option value="">Version de la régie</option></select></section>
<article aria-live="polite"><h1 id="reference">En attente</h1><p id="verse">Scannez le QR code depuis la régie.</p></article>
<section id="stage"><small>Passage suivant</small><h2 id="next">—</h2></section>
<section id="controls" hidden><form id="search"><input id="query" aria-label="Référence à projeter" placeholder="Jean 3:16" maxlength="200" required><button>Projeter</button></form><p class="actions"><button data-command="prev">Précédent</button><button data-command="next">Suivant</button><button data-command="clear">Effacer</button></p></section>
<p id="message" role="status"></p>
<script>
const token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'',location.pathname+location.search);let ws,scene={},retry=0,ackTimer;
const el=id=>document.getElementById(id);el('stage').hidden=new URLSearchParams(location.search).get('view')!=='stage';
function render(){el('reference').textContent=scene.reference||'En attente';const value=el('language').value;const translated=scene.translations?.[value];el('verse').textContent=(typeof translated==='string'?translated:translated?.text)||scene.text||'Aucun passage à l’écran';el('next').textContent=scene.next_reference||'—'}
function ack(){if(ws?.readyState===1&&scene.scene_id&&!document.hidden)ws.send(JSON.stringify({type:'rendered',scene_id:scene.scene_id,surface:'companion'}))}
function send(data){if(ws?.readyState===1){el('message').textContent='';ws.send(JSON.stringify(data))}}
function connect(){if(!token){el('connection').textContent='QR code requis';return}ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/stream`,['versepro','versepro.auth.'+token]);ws.onopen=()=>{retry=0;el('connection').textContent='Connecté';document.querySelectorAll('button').forEach(b=>b.disabled=false);clearInterval(ackTimer);ackTimer=setInterval(ack,5000)};ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='permissions'){el('controls').hidden=d.role!=='operator';return}if(d.type==='error'){el('message').textContent=d.message;return}if(d.type&&d.type!=='scripture')return;scene=d;const selected=el('language').value;el('language').replaceChildren(new Option('Version de la régie',''),...Object.keys(d.translations||{}).map(v=>new Option(v,v)));el('language').value=selected;render();requestAnimationFrame(()=>requestAnimationFrame(ack))};ws.onclose=e=>{clearInterval(ackTimer);document.querySelectorAll('button').forEach(b=>b.disabled=true);el('connection').textContent=e.code===1008?'Partage terminé · nouveau QR requis':'Déconnecté · dernier passage conservé';if(e.code!==1008&&retry++<8)setTimeout(connect,Math.min(1000*2**retry,15000))}}
el('language').onchange=render;el('search').onsubmit=e=>{e.preventDefault();send({type:'project',reference:el('query').value})};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send({type:b.dataset.command}));connect();
</script></html>
